name: build

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: kicad/kicad:10.0.8@sha256:3f4a01786dfbe803a65f345c3342b765db9add913f5e9448f8356793714ddc34
      options: --user root
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check design
        run: python3 tools/check_design.py

      - name: Export schematic, BOM and layout preview
        run: |
          mkdir -p elec/build
          kicad-cli sch export pdf \
            --output elec/build/milsblo-schematic.pdf \
            elec/kicad/milsblo.kicad_sch
          # shellcheck disable=SC2016 # ${QUANTITY} is a KiCad field variable.
          kicad-cli sch export bom \
            --fields 'Reference,Value,Footprint,${QUANTITY},LCSC Part,Partnumber' \
            --labels 'Reference,Value,Footprint,Qty,LCSC Part,Partnumber' \
            --group-by 'LCSC Part,Value' \
            --output elec/build/milsblo-bom.csv \
            elec/kicad/milsblo.kicad_sch
          kicad-cli pcb export svg \
            --layers 'F.Cu,B.Cu,F.SilkS,B.SilkS,Edge.Cuts' \
            --black-and-white \
            --mode-single \
            --output elec/build/pcb-layout.svg \
            elec/kicad/milsblo.kicad_pcb

      - name: Upload exports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build
          path: elec/build/
          if-no-files-found: error

  publish-preview:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build
          path: elec/build/

      - name: Commit layout preview
        run: |
          cp elec/build/pcb-layout.svg docs/pcb-layout.svg
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/pcb-layout.svg
          git diff --cached --quiet || git commit -m "ci: update PCB layout preview [skip ci]"
          git push
